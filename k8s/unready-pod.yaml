apiVersion: v1
kind: Pod
metadata:
  name: lab-api-unready
  labels:
    app: lab-api
spec:
  containers:
    - name: api
      image: sre-reliability-lab:0.1.0
      imagePullPolicy: Never
      env:
        - name: APP_READY
          value: "false"
      ports:
        - containerPort: 8000
      readinessProbe:
        httpGet:
          path: /readyz
          port: 8000
        initialDelaySeconds: 2
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 10