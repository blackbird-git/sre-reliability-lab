apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
data:
  alerts.yml: |
    groups:
      - name: lab-readiness
        interval: 15s
        rules:
          - alert: LabReadinessFailures
            expr: |
              sum by (pod) (
                rate(lab_http_requests_total{
                  job="lab-api",
                  route="/readyz",
                  status="503"
                }[1m])
              ) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Readiness failures for {{ $labels.pod }}"